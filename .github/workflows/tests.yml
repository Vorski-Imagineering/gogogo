name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
      - name: Skills and scripts name no stack
        run: |
          if grep -rniE 'manage\.py|npm |firebase|django|htmx' plugins/gogogo/skills plugins/gogogo/scripts plugins/gogogo/evals --exclude-dir=results; then exit 1; fi
          if grep -rniE 'sentry' plugins/gogogo/skills plugins/gogogo/scripts plugins/gogogo/evals --exclude-dir=sentry-debug --exclude-dir='sentry-debug-*' --exclude-dir=results | grep -vE '^plugins/gogogo/scripts/profile_check\.py:[0-9]+:.*("sentry\.|SENTRY)'; then exit 1; fi
